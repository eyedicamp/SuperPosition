<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Super Position — Timetable</title>
  <link rel="stylesheet" href="styles.css?v=tt1" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="brand">
        <h1 class="title"><span class="title-emoji" aria-hidden="true">🍟</span> Timetable</h1>
        <p class="subtitle">Schedules by person (availability + preference)</p>
      </div>
      <div class="card-actions">
        <button id="btnBack" class="ghost">← Back</button>
        <button id="btnDownload" class="primary" disabled>Download CSV</button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>Day</h2>
      </div>
      <div id="dayTabs" class="tabs"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Grid</h2>
      </div>

      <div id="emptyState" class="muted" style="display:none;">
        No schedule found. Go back and generate random data or load a CSV.
      </div>

      <div id="gridWrap" class="gridwrap" style="display:none;"></div>

      <div class="inline-note" style="margin-top:12px;">
        <b>Legend:</b> white=available, gray=busy, yellow=preference (slot start)
      </div>
    </section>
  </div>

  <script src="timetable.js?v=tt1"></script>
</body>
</html>
